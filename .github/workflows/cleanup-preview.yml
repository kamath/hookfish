name: Clean up preview

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cleanup-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_NAME: smithery-pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      # This trusted workflow intentionally never checks out or executes pull request code.
      - name: Delete Cloudflare Worker
        run: |
          BODY="$RUNNER_TEMP/cloudflare-delete.json"
          STATUS=$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' \
            --request DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          if [[ "$STATUS" != "200" && "$STATUS" != "404" ]]; then
            jq '{success, errors}' "$BODY"
            exit 1
          fi

          VERIFY_STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          test "$VERIFY_STATUS" = "404"

      - name: Publish cleanup summary
        run: |
          {
            echo "### Preview removed"
            echo
            echo "- Cloudflare Worker: \`$WORKER_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update pull request deployment comment
        if: always()
        uses: actions/github-script@v8
        env:
          CLEANUP_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- smithery-preview-deployment -->'
            const succeeded = process.env.CLEANUP_STATUS === 'success'
            const body = [
              marker,
              succeeded ? '### 🧹 Preview removed' : '### ⚠️ Preview cleanup failed',
              '',
              succeeded
                ? 'The Cloudflare Worker was deleted.'
                : 'The preview Worker could not be deleted.',
              '',
              `[View cleanup logs](${process.env.RUN_URL})`,
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
