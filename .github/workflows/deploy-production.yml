name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_NAME: smithery
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Restore or save Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - name: Build Worker
        run: pnpm turbo run build --filter=@hookfish/example-cloudflare

      - name: Deploy production Worker
        run: |
          pnpm --filter @hookfish/example-cloudflare exec wrangler deploy \
            --config dist/server/wrangler.json \
            --name "$WORKER_NAME"

      - name: Resolve production URL
        id: production
        run: |
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          SUBDOMAIN=$(jq -er '.result.subdomain' <<< "$RESPONSE")
          URL="https://$WORKER_NAME.$SUBDOMAIN.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test production
        env:
          PRODUCTION_URL: ${{ steps.production.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "$PRODUCTION_URL/" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "$PRODUCTION_URL/api/openapi.json" > /dev/null

      - name: Publish deployment summary
        env:
          PRODUCTION_URL: ${{ steps.production.outputs.url }}
        run: |
          {
            echo "### Production deployed"
            echo
            echo "- Worker: [$WORKER_NAME]($PRODUCTION_URL)"
            echo "- Application and OpenAPI smoke tests passed."
          } >> "$GITHUB_STEP_SUMMARY"
