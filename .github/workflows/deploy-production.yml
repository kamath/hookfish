name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_NAME: hookfish
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Restore or save Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - name: Build Worker
        run: pnpm turbo run build --filter=@hookfish/example-cloudflare

      - name: Create Worker secrets file
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          # Web search stays off (503) when the EXA_API_KEY Actions secret is unset.
          SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
          jq -n --arg exaApiKey "$EXA_API_KEY" \
            'if $exaApiKey == "" then {} else {EXA_API_KEY: $exaApiKey} end' \
            > "$SECRETS_FILE"
          chmod 600 "$SECRETS_FILE"
          echo "SECRETS_FILE=$SECRETS_FILE" >> "$GITHUB_ENV"

      - name: Deploy production Worker
        run: |
          pnpm --filter @hookfish/example-cloudflare exec wrangler deploy \
            --config dist/server/wrangler.json \
            --name "$WORKER_NAME" \
            --secrets-file "$SECRETS_FILE"

      - name: Resolve production URL
        id: production
        run: |
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          SUBDOMAIN=$(jq -er '.result.subdomain' <<< "$RESPONSE")
          URL="https://$WORKER_NAME.$SUBDOMAIN.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test production
        env:
          PRODUCTION_URL: ${{ steps.production.outputs.url }}
          PUBLIC_URL: https://hookfish.dev
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "$PRODUCTION_URL/" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "$PRODUCTION_URL/api/openapi.json" > /dev/null
          for URL in "$PRODUCTION_URL" "$PUBLIC_URL"; do
            test "$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
              "$URL/api/registry/feed" | jq 'length')" -gt 0
          done

      - name: Publish deployment summary
        env:
          PRODUCTION_URL: ${{ steps.production.outputs.url }}
        run: |
          {
            echo "### Production deployed"
            echo
            echo "- Worker: [$WORKER_NAME]($PRODUCTION_URL)"
            echo "- Suggestions smoke tests passed."
          } >> "$GITHUB_STEP_SUMMARY"
