name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Version packages or publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      # Do not set registry-url. setup-node would write an empty
      # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} line, and npm
      # then skips OIDC trusted publishing and 404s the PUT.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Enable npm trusted publishing
        run: npm install --global npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Create version packages PR or publish to npm
        uses: changesets/action@v1
        with:
          title: Version Packages
          commit: Version Packages
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
