name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Builds every example, so a dependency that stops working on one runtime fails here.
      - run: pnpm build
      - run: pnpm test
      # Validates the Worker bundle without needing Cloudflare credentials.
      - run: pnpm --filter @hookfish/example-cloudflare check

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/docker/Dockerfile
          load: true
          tags: smithery-example:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --rm -p 3000:3000 --name smithery smithery-example:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          curl -fsS -o /dev/null -w 'shell %{http_code}\n' http://127.0.0.1:3000/
          curl -fsS -o /dev/null -w 'api   %{http_code}\n' http://127.0.0.1:3000/api/openapi.json
          docker stop smithery
