name: Deploy preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Neon branch and Cloudflare Worker
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORKER_NAME: smithery-pr-${{ github.event.pull_request.number }}
      NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Resolve preview URL
        id: preview
        run: |
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          SUBDOMAIN=$(jq -er '.result.subdomain' <<< "$RESPONSE")
          URL="https://$WORKER_NAME.$SUBDOMAIN.workers.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if curl --fail --silent --show-error "$URL/" > /dev/null; then
            echo "previous_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "previous_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark preview deployment as WIP
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIOUS_EXISTS: ${{ steps.preview.outputs.previous_exists }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- smithery-preview-deployment -->'
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })

            if (pull.head.sha !== process.env.COMMIT_SHA) {
              core.info('A newer commit is already at the head of this pull request; skipping the WIP comment.')
              return
            }

            const lines = [
              marker,
              '### 🚧 WIP: Preview build/deploy in progress',
              '',
              `Commit: \`${process.env.COMMIT_SHA.slice(0, 7)}\``,
              `[View build logs](${process.env.RUN_URL})`,
            ]

            if (process.env.PREVIOUS_EXISTS === 'true') {
              lines.splice(
                3,
                0,
                `The **[previous deployment remains available](${process.env.PREVIEW_URL})** until this one is ready.`,
                '',
              )
            }

            const body = lines.join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Restore or save Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm install --frozen-lockfile

      - name: Set branch expiration
        id: expiration
        run: echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create or reuse Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ env.NEON_BRANCH }}
          expires_at: ${{ steps.expiration.outputs.expires_at }}

      - name: Apply database migrations
        run: pnpm --filter @hookfish/api db:migrate:prod
        env:
          POSTGRES_URL: ${{ steps.neon.outputs.db_url }}

      - name: Build Worker
        run: pnpm turbo run build --filter=@hookfish/example-cloudflare

      - name: Create Worker secrets file
        env:
          POSTGRES_URL: ${{ steps.neon.outputs.db_url }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          SECRETS_FILE="$RUNNER_TEMP/worker-secrets.json"
          jq -n \
            --arg postgresUrl "$POSTGRES_URL" \
            --arg authSecret "$BETTER_AUTH_SECRET" \
            '{POSTGRES_URL: $postgresUrl, BETTER_AUTH_SECRET: $authSecret}' \
            > "$SECRETS_FILE"
          chmod 600 "$SECRETS_FILE"
          echo "SECRETS_FILE=$SECRETS_FILE" >> "$GITHUB_ENV"

      - name: Deploy preview Worker
        run: |
          pnpm --filter @hookfish/example-cloudflare exec wrangler deploy \
            --config dist/server/wrangler.json \
            --name "$WORKER_NAME" \
            --secrets-file "$SECRETS_FILE"

      - name: Smoke test preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "$PREVIEW_URL/" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "$PREVIEW_URL/api/openapi.json" > /dev/null
          test "$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            "$PREVIEW_URL/api/auth/session" | jq -r '.user')" = "null"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST "$PREVIEW_URL/api/auth/login" \
            --header "origin: $PREVIEW_URL" \
            --header "content-type: application/json" \
            --data '{"email":"smoke-test@example.invalid","password":"invalid"}')" = "400"

      - name: Publish deployment summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          {
            echo "### Preview deployed"
            echo
            echo "- Worker: [$WORKER_NAME]($PREVIEW_URL)"
            echo "- Neon branch: \`$NEON_BRANCH\` (\`$NEON_BRANCH_ID\`)"
            echo "- Migrations and authenticated database smoke tests passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update pull request deployment comment
        if: always()
        uses: actions/github-script@v8
        env:
          JOB_STATUS: ${{ job.status }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIOUS_EXISTS: ${{ steps.preview.outputs.previous_exists }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- smithery-preview-deployment -->'
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })

            if (pull.head.sha !== process.env.COMMIT_SHA) {
              core.info('A newer commit is already at the head of this pull request; skipping the final comment.')
              return
            }

            const succeeded = process.env.JOB_STATUS === 'success'
            const previousExists = process.env.PREVIOUS_EXISTS === 'true'
            const previewUrl = process.env.PREVIEW_URL
            const runUrl = process.env.RUN_URL
            const shortSha = process.env.COMMIT_SHA.slice(0, 7)
            const neonBranchId = process.env.NEON_BRANCH_ID
            const neonBranchUrl = neonBranchId
              ? `https://console.neon.tech/app/projects/${process.env.NEON_PROJECT_ID}/branches/${neonBranchId}`
              : null

            const lines = [
              marker,
              succeeded ? '### ✅ Preview deployed' : '### ❌ Preview deployment failed',
              '',
            ]

            if (succeeded) {
              lines.push(`**[Open the latest preview](${previewUrl})**`)
            } else if (previousExists) {
              lines.push(`The build failed, but the **[previous deployment is still available](${previewUrl})**.`)
            } else {
              lines.push('The build failed and no previous deployment is available.')
            }

            if (neonBranchUrl) {
              lines.push('', `[Open the Neon branch](${neonBranchUrl})`)
            }
            lines.push('', `Commit: \`${shortSha}\``, `[View build logs](${runUrl})`)
            const body = lines.join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.body?.includes(marker),
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
