services:
  - type: web
    name: smithery
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm install -g pnpm@10.33.3 && pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@hookfish/example-node
    startCommand: pnpm --filter @hookfish/example-node start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
